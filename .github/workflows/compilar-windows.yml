name: Compilar Mezquita PDF (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      edicion_imibic:
        description: "Crear también la edición del IMIBIC (logotipos de los secretos MARCA_IMIBIC y MARCA_FIBICO)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # la consola de Windows no usa UTF-8 por defecto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo paquetes oficiales ya compilados y sin caché (como en el Mac)
      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir --only-binary=:all: -r requirements.txt pyinstaller

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python pruebas/prueba_basica.py

      - name: Revisar el código (nombres sin definir)
        run: |
          pip install pyflakes
          python pruebas/revisar_codigo.py

      - name: Todas las ventanas caben en la pantalla de un portátil
        run: python pruebas/prueba_pantallas.py

      - name: Mover texto y anotaciones (ratón y teclado)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python pruebas/prueba_mover.py

      - name: Extensión de Chrome (código fuente)
        run: python pruebas/prueba_chrome.py

      - name: Certificados de prueba en el almacén de Windows
        shell: pwsh
        run: |
          $comun = @{
            CertStoreLocation = 'Cert:\CurrentUser\My'; KeyUsage = 'DigitalSignature', 'NonRepudiation'
            NotAfter = (Get-Date).AddDays(2); KeyExportPolicy = 'NonExportable'
          }
          New-SelfSignedCertificate @comun -Subject 'CN=Prueba Mezquita CNG RSA' -KeyAlgorithm RSA -KeyLength 2048 -Provider 'Microsoft Software Key Storage Provider' | Out-Null
          New-SelfSignedCertificate @comun -Subject 'CN=Prueba Mezquita CNG EC' -KeyAlgorithm ECDSA_nistP256 -Provider 'Microsoft Software Key Storage Provider' | Out-Null
          New-SelfSignedCertificate @comun -Subject 'CN=Prueba Mezquita CryptoAPI' -KeyAlgorithm RSA -KeyLength 2048 -Provider 'Microsoft Enhanced Cryptographic Provider v1.0' -KeySpec Signature | Out-Null
          Get-ChildItem Cert:\CurrentUser\My | Format-Table Subject, HasPrivateKey

      - name: Pruebas de Windows (certificados, Claude, una sola copia, capturas)
        run: python pruebas/prueba_windows.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-windows
          path: pruebas/salida_windows

      - name: Crear la aplicación
        run: pyinstaller --noconfirm --clean MezquitaPDF.spec

      # Si la app empaquetada no arranca, la compilación falla y no se publica nada
      - name: Comprobar que la app arranca
        shell: bash
        run: |
          "dist/Mezquita PDF/mezquita-mcp.exe" --diagnostico | tee diagnostico.txt
          grep -q "Mezquita PDF $(python -c 'import sys; sys.path.insert(0, "visor"); import version; print(version.VERSION)')" diagnostico.txt

      - name: Crear el instalador
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'visor'); import version; print(version.VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DVersion=$version" recursos\instalador_windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\MezquitaPDF-windows.exe | Format-List Name, Length

      - name: Probar el instalador (instalar, arrancar, Claude, desinstalar)
        shell: pwsh
        run: |
          Start-Process dist\MezquitaPDF-windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Mezquita PDF"
          if (-not (Test-Path "$app\Mezquita PDF.exe")) { throw "No se ha instalado" }
          & "$app\mezquita-mcp.exe" --diagnostico
          python pruebas/prueba_mcp_exe.py "$app\mezquita-mcp.exe" --estado
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Extensión de Chrome: mensajes con el programa instalado y registro en Chrome y Edge
          python pruebas/prueba_chrome.py "$app\mezquita-mcp.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$app\mezquita-mcp.exe" --registrar-chrome
          $json = (Get-ItemProperty 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\es.mezquitapdf.chrome').'(default)'
          $host_chrome = Get-Content $json -Raw | ConvertFrom-Json
          if ($host_chrome.path -ne "$app\mezquita-mcp.exe") { throw "Registro de Chrome: '$($host_chrome.path)'" }
          Stop-Process -Name 'Mezquita PDF' -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          # El desinstalador termina en segundo plano: se le da un poco de tiempo
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\Mezquita PDF.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\Mezquita PDF.exe") { throw "No se ha desinstalado" }
          Write-Output "Instalar, arrancar, extensión de Claude y desinstalar: correcto"

      - uses: actions/upload-artifact@v4
        with:
          name: MezquitaPDF-windows
          path: dist/MezquitaPDF-windows.exe

      # La extensión de Chrome, en un .zip para cargarla en Chrome (modo desarrollador)
      - name: Empaquetar la extensión de Chrome
        shell: pwsh
        run: Compress-Archive -Path extension_chrome\* -DestinationPath dist\MezquitaPDF-extension-chrome.zip

      # Edición del IMIBIC: el mismo programa con sus logotipos para la marca de agua del sello.
      # Los logotipos vienen de secretos del repositorio (no están en el código) y el instalador solo
      # se guarda un día, como artefacto, para descargarlo. Nunca se publica en Releases.
      - name: Crear y probar la edición del IMIBIC
        if: github.event_name == 'workflow_dispatch' && inputs.edicion_imibic
        shell: pwsh
        env:
          MARCA_IMIBIC: ${{ secrets.MARCA_IMIBIC }}
          MARCA_FIBICO: ${{ secrets.MARCA_FIBICO }}
        run: |
          if (-not $env:MARCA_IMIBIC -or -not $env:MARCA_FIBICO) { throw "Faltan los secretos MARCA_IMIBIC y MARCA_FIBICO" }
          $marcas = Join-Path $env:RUNNER_TEMP 'marcas'
          New-Item -ItemType Directory -Force $marcas | Out-Null
          [IO.File]::WriteAllBytes("$marcas\IMIBIC.png", [Convert]::FromBase64String($env:MARCA_IMIBIC))
          [IO.File]::WriteAllBytes("$marcas\FIBICO.png", [Convert]::FromBase64String($env:MARCA_FIBICO))
          $version = python -c "import sys; sys.path.insert(0, 'visor'); import version; print(version.VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" "/DMarcas=$marcas" `
            "/DMarcaPorDefecto=IMIBIC" "/DSalida=MezquitaPDF-IMIBIC-windows" recursos\instalador_windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process dist\MezquitaPDF-IMIBIC-windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Mezquita PDF"
          & "$app\mezquita-mcp.exe" --diagnostico
          foreach ($n in 'IMIBIC', 'FIBICO') {
            if (-not (Test-Path "$env:APPDATA\MezquitaPDF\marcas\$n.png")) { throw "Falta el logotipo $n" }
          }
          $elegida = (Get-ItemProperty 'HKCU:\Software\MezquitaPDF\Mezquita PDF\firma').marca
          if ($elegida -ne 'IMIBIC') { throw "Marca de agua de entrada: '$elegida'" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Get-Item dist\MezquitaPDF-IMIBIC-windows.exe | Format-List Name, Length
          Write-Output "Edición del IMIBIC: logotipos instalados e IMIBIC elegido de entrada"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.edicion_imibic
        with:
          name: MezquitaPDF-IMIBIC-windows
          path: dist/MezquitaPDF-IMIBIC-windows.exe
          retention-days: 1

      - name: Publicar en Releases (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MezquitaPDF-windows.exe
            dist/MezquitaPDF-extension-chrome.zip
